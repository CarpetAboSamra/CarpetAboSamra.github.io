<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض أبو سمرة كاربت</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body onload="initStore()">
  <header>
    <div class="header-container">
      <div class="logo-area">
        <img src="" id="storeLogo" alt="شعار المعرض" class="logo-img" style="display:none;" />
        <div class="brand-info">
          <h1 id="storeTitle">معرض أبو سمرة كاربت</h1>
        </div>
      </div>
      <button class="cart-btn" onclick="toggleCart(true)">
        <span>🛒 السلة</span>
        <span class="cart-badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="cover-section" id="coverBanner">
    <div class="cover-wrapper">
      <div class="cover-image-box">
        <img src="" id="coverImage" alt="غلاف المعرض" style="display:none;" />
      </div>
      <div class="cover-text-bar">
        <h2 id="coverTitle">فخامة تليق بمنزلك</h2>
        <p id="coverDesc">تشكيلة مميزة من أرقى السجاد.</p>
      </div>
    </div>
  </section>

  <div class="store-container">
    <section class="controls-card">
      <div class="search-group">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم السجادة..." oninput="applyFilters()" />
        <select id="sizeFilter" class="size-filter" onchange="applyFilters()">
          <option value="ALL">جميع المقاسات</option>
        </select>
      </div>
      <div class="categories-scroll" id="categoriesBar">
        <button class="cat-pill active" onclick="selectCategory('ALL', this)">الكل</button>
      </div>
    </section>

    <main class="products-grid" id="productsGrid">
      <div class="empty-msg">جاري تحميل السجاد...</div>
    </main>
  </div>

  <div class="cart-overlay" id="cartModal" onclick="closeCartOnOverlay(event)">
    <div class="cart-drawer">
      <div class="drawer-top">
        <h3>سلة المشتريات</h3>
        <button class="close-cart" onclick="toggleCart(false)">&times;</button>
      </div>
      <div class="cart-items-list" id="cartItemsContainer"></div>
      <form class="checkout-box" id="checkoutForm" onsubmit="submitOrder(event)">
        <div class="total-display">
          <span>الإجمالي المطلوب:</span>
          <span id="cartTotal">0 ج.م</span>
        </div>
        <div class="form-field">
          <label>الاسم بالكامل *</label>
          <input type="text" id="custName" required placeholder="محمد أحمد" />
        </div>
        <div class="form-field">
          <label>رقم الموبايل (واتساب) *</label>
          <input type="tel" id="custPhone" required placeholder="01xxxxxxxxx" />
        </div>
        <div class="form-field">
          <label>العنوان بالتفصيل *</label>
          <input type="text" id="custAddress" required placeholder="العنوان" />
        </div>
        <div class="form-field">
          <label>طريقة الدفع *</label>
          <select id="paymentMethod">
            <option value="الدفع عند الاستلام">الدفع عند الاستلام</option>
          </select>
        </div>
        <button type="submit" class="submit-order" id="submitOrderBtn">تأكيد الطلب</button>
      </form>
    </div>
  </div>

  <footer>
    <div class="footer-info">
      <span id="footerAddress"></span>
      <span id="footerPhone"></span>
    </div>
    <p id="footerText">جميع الحقوق محفوظة</p>
    <div style="margin-top: 12px;">
      <a href="admin.html" style="color: inherit; opacity: 0.7; font-size: 0.85rem; text-decoration: none; border: 1px solid currentColor; padding: 4px 12px; border-radius: 6px; display: inline-block;">
        ⚙️ إدارة المتجر
      </a>
    </div>
  </footer>

  <div class="toast" id="toastMsg"></div>
  <script src="script.js"></script>
</body>
</html>
